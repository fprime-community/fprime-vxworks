# Required by the CI system
deployment-name: FprimeVxWorksReference_ReferenceDeployment
platform-name: vxworks
power-port: 0
test-scripts:
  - FprimeVxWorksReference/ReferenceDeployment/test/int/test.py
  - lib/fprime/Svc/CmdDispatcher/test/int/test_cmd_dispatcher.py
  - lib/fprime/Svc/EventManager/test/int/test_cmd_eventManager.py
  - lib/fprime/Svc/Version/test/int/test_cmd_version.py
dictionary: build-artifacts/vxworks/FprimeVxWorksReference_ReferenceDeployment/dict/FprimeVxWorksReferenceTopologyDictionary.json
executable: build-artifacts/vxworks/FprimeVxWorksReference_ReferenceDeployment/bin/FprimeVxWorksReference_ReferenceDeployment

# Optional CI system config
jobs: 4

extra-gds-arguments:
  - --zmq-transport
  - ipc:///tmp/fprime-server-ci-in-bbb
  - ipc:///tmp/fprime-server-ci-out-bbb
  - --ip-client
  - --ip-address
  - 192.168.0.254
  - --gui-port
  - "4444"

extra-pytest-arguments:
  - -s
  - --zmq-transport
  - ipc:///tmp/fprime-server-ci-in-bbb
  - ipc:///tmp/fprime-server-ci-out-bbb
  - --deployment-config
  - FprimeVxWorksReference/ReferenceDeployment/test/int/int_config.json

# Plugin CLI arguments
plugin:
  ci-selection: vxworks-dkm
  port: /dev/bbb
  baud: 115200

# Plugin required keys
vip-path: /ci/builds/VxWorks7-22.09-BeagleBoneBlack-Image
dtb-name: am335x-boneblack.dtb
wr-shell-path: /opt/windriver/22.09/wrenv.linux
remote-data: /ci/remote-data

build-outputs:
  - /ci/builds/VxWorks7-22.09-BeagleBoneBlack-Image/default/uVxWorks
  - /ci/builds/VxWorks7-22.09-BeagleBoneBlack-Image/default/am335x-boneblack.dtb
environment:
  VSB_LOCATION: /ci/builds/VxWorks7-22.09-BeagleBoneBlack-Source
  WIND_HOME: /opt/windriver/22.09
