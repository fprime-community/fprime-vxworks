[environment]
WIND_TOOLS_HOME=/home/ortega/toolchains
WIND_HOME=%(WIND_TOOLS_HOME)s/vxworks
WIND_BASE=%(WIND_HOME)s/vxworks
VSB_HOME=%(WIND_BASE)s/24.03/samples/prebuilt_projects/vsb_itl_generic
WIND_COMP=%(WIND_HOME)s/compilers/llvm-17.0.6.1/LINUX64/bin
LINK_BIN_PRE=%(WIND_COMP)s/ldpentium
LINK_BIN_PRE_FLAGS=-m elf_x86_64 -X -r --eh-frame-hdr --no-warn-execstack --no-warn-rwx-segments
LINK_BIN_PRE_TO=-o
LINK_BIN_PRE_EXT_LIB=
DUMP=%(WIND_COMP)s/nmpentium
MUNCH=tclsh %(WIND_BASE)s/24.03/source/build/mk/tcl/munch.tcl -c llvm -tags %(VSB_HOME)s/krnl/tags/dkm.tags
CC_MUNCH=%(WIND_COMP)s/ccllvm -fdollars-in-identifiers -w
CFLAGS=-O2
COMPILE_ONLY=-c
COMPILE_TO=-o
LINK_BIN_POST=%(WIND_COMP)s/ldpentium
LINK_BIN_POST_FLAGS=-m elf_x86_64 --no-relax -X -r   --eh-frame-hdr  --no-warn-execstack --no-warn-rwx-segments --force-group-allocation -T %(VSB_HOME)s/krnl/ldscripts/dkm.ld
LINK_BIN_POST_TO=-o
SYMBOL_CHECK=
SYMBOL_CHECK_FILE=
DEMANGLE=%(WIND_COMP)s/llvm-cxxfilt
