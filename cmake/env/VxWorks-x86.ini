[environment]
WIND_HOME=/home/ortega/toolchains/vxworks
WIND_BASE=%(WIND_HOME)s/vxworks
WINDRIVER_COMPILER_ROOT=%(WIND_HOME)s/compilers/llvm-17.0.6.1/LINUX64
VSB_HOME=%(WIND_BASE)s/24.03/samples/prebuilt_projects/vsb_itl_generic
WIND_COMP=%(WINDRIVER_COMPILER_ROOT)s/bin
LINK_BIN_PRE=%(WIND_COMP)s/ldpentium
LINK_BIN_PRE_FLAGS=-m elf_x86_64 -X -r --eh-frame-hdr --no-warn-execstack --no-warn-rwx-segments
LINK_BIN_PRE_TO=-o
LINK_BIN_PRE_EXT_LIB=
DUMP=%(WIND_COMP)s/nmpentium
MUNCH=tclsh %(WIND_BASE)s/24.03/source/build/mk/tcl/munch.tcl -c pentium -tags %(VSB_HOME)s/krnl/tags/dkm.tags
CC_MUNCH=%(WIND_COMP)s/ccllvm -fdollars-in-identifiers -w
CFLAGS=-DTGT_OS_TYPE_VXWORKS -DTGT_OS_TYPE_VXWORKS7 --target=x86_64 -m64 -mcmodel=large -mno-red-zone -nostdlib -fno-omit-frame-pointer -mno-implicit-float -march=core2 -std=c11 -D__vxworks -D__VXWORKS__ -D__ELF__ -D_HAVE_TOOL_XTORS  -nostdlibinc -nostdinc++ -ftls-model=local-exec -fno-builtin -fno-strict-aliasing -D_USE_INIT_ARRAY -fwrapv -mllvm -two-entry-phi-node-folding-threshold=2 -fno-unwind-tables -fno-asynchronous-unwind-tables -fdollars-in-identifiers -Wall -Wconversion -Wno-sign-conversion -Wno-unused-but-set-variable -Wno-deprecated-non-prototype -MD -MP -I%(VSB_HOME)s/share/h -isystem%(VSB_HOME)s/krnl/h/system -isystem%(VSB_HOME)s/krnl/h/public -DCPU=_VX_CORE -DTOOL_FAMILY=llvm -DTOOL=llvm -D_WRS_KERNEL -D_WRS_VX_SMP -D_WRS_CONFIG_SMP -D_VSB_CONFIG_FILE=\"%(VSB_HOME)s/h/config/vsbConfig.h\" -pedantic -O2
COMPILE_ONLY=-c
COMPILE_TO=-o
LINK_BIN_POST=%(WIND_COMP)s/ldpentium
LINK_BIN_POST_FLAGS=-m elf_x86_64 --no-relax -X -r --eh-frame-hdr  --no-warn-execstack --no-warn-rwx-segments --force-group-allocation -T %(VSB_HOME)s/krnl/ldscripts/dkm.ld
LINK_BIN_POST_TO=-o
SYMBOL_CHECK=
SYMBOL_CHECK_FILE=
DEMANGLE=%(WIND_COMP)s/llvm-cxxfilt
